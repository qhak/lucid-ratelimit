name: Feature request
description: Suggest an API or operational improvement.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem to solve
      description: What are you trying to build or operate?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: Describe the behavior and any consistency or failure tradeoffs.
    validations:
      required: true
